

apiVersion: v1
kind: ShutdownPolicy
metadata:
  name: dev-test-auto-shutdown
  description: "Automatically shutdown resources in development and test environments"

spec:
  
  environments:
    - dev
    - test
    - staging

  
  schedule:
    timezone: "UTC"
    weekdays:
      enabled: true
      shutdownTime: "18:00"  
      startupTime: "06:00"   
    weekends:
      enabled: true
      shutdownTime: "18:00"  
      startupTime: "09:00"   

  
  resourceTypes:
    - virtualMachines
    - virtualMachineScaleSets
    - databases
    - appServices

  
  exclusions:
    
    tags:
      - key: "AutoShutdown"
        value: "false"
      - key: "Critical"
        value: "true"
      - key: "Environment"
        value: "prod"  

    
    resourceNames:
      - "^jumpbox.*"
      - "^bastion.*"
      - ".*-permanent$"

    
    resourceGroups:
      - "infrastructure-rg"
      - "shared-services-rg"

  
  preShutdown:
    enabled: true
    actions:
      - type: "notification"
        template: "Resource {{resourceName}} will be shut down in 30 minutes due to auto-shutdown policy"
        channels: ["email", "slack"]
      - type: "backup"
        enabled: true
        resources: ["databases"]

  
  postShutdown:
    enabled: true
    actions:
      - type: "log"
        message: "Successfully shut down {{resourceName}}"
      - type: "tag"
        key: "LastShutdown"
        value: "{{timestamp}}"

  
  gracePeriod:
    enabled: true
    duration: "30m"  
    warningIntervals: ["15m", "5m"]

  
  monitoring:
    enabled: true
    metrics:
      - name: "shutdown_events_total"
        type: "counter"
        labels: ["environment", "resource_type"]
      - name: "shutdown_failures_total"
        type: "counter"
        labels: ["environment", "resource_type", "reason"]

  
  costTracking:
    enabled: true
    currency: "USD"
    reportFrequency: "daily"

  
  emergencyOverride:
    enabled: true
    tag: "EmergencyOverride"
    duration: "24h"  
    approvalRequired: true
    approvers:
      - "admin@company.com"
      - "devops@company.com"

  
  compliance:
    enabled: true
    auditLogRetention: "90d"
    reportRecipients:
      - "compliance@company.com"
      - "finops@company.com"
